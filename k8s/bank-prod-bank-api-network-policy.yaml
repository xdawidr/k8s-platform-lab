apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bank-api-policy
  namespace: bank-prod
spec:
  podSelector:
    matchLabels:
      app: bank-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 35.191.0.0/16
    - ipBlock:
        cidr: 130.211.0.0/22
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - ports:
    - protocol: TCP
      port: 5432
    to:
    - podSelector:
        matchLabels:
          app: postgres