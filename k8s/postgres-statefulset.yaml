apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        resources: 
          requests:
            cpu: "250m"
            memory: "512Mi"
        ports:
        - containerPort: 5432
        env:
        - name: PGDATA 
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_DB
          value: "bankdb"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: bank-api-secret
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc